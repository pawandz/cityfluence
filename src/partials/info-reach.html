<section class="section section--tight" aria-labelledby="reach-title">
  <div class="container">
    <header class="section-head">
      <p class="eyebrow" data-reveal>Get in touch</p>
      <h2 class="section-title section-title--sm" id="reach-title" data-split>Talk to a real person.</h2>
    </header>
    <ul class="contact-tiles" data-reveal-group>
      {{render:contact-cards}}
    </ul>
    <p class="contact-tiles__note" data-reveal>Prefer writing it down? Use the <a class="link-underline" href="{{root}}contact/#forms">contact forms</a> for campaigns, creator registration or partnerships.</p>
  </div>
</section>
