<!doctype html>
<html lang="en-IN" data-root="{{root}}" data-page="{{page}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#F3F0E8">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:locale" content="en_IN">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Chandigarhcitylyf logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
{{extraHead}}
<link rel="icon" href="{{root}}assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{root}}css/main.css">
<script>document.documentElement.classList.add('js');window.__cfReveal=setTimeout(function(){document.documentElement.classList.add('motion-fallback')},2500);</script>
{{jsonld}}
</head>
<body class="{{bodyClass}}">
